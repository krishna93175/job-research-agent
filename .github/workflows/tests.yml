name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deterministic tests
        run: |
          python test_url_cleaner.py
          python test_requirements_filter.py
          python test_deduplicator.py
          python test_strategy.py
          python test_web_normalizer.py
          python test_match_scorer.py
          python test_ranker.py
          python test_formatter.py
          python test_job_discovery_integration.py
          python test_orchestrator_mock.py